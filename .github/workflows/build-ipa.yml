name: Build IPA From Upstream

# 用途：仓库不是你的时候用。
# 放到你自己任意一个仓库（甚至空仓库）的 .github/workflows/build-ipa.yml，
# 它会自己去拉 Axixi2233/moonlight-ios 的代码并构建，你完全不碰别人的仓库。
# public 仓库的 macOS runner 不计量；private 仓库按分钟计费（macOS ×10 倍率）。

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游分支或 tag（默认 master）'
        required: false
        default: 'master'
      bundle_id:
        description: 'Bundle ID（留空用工程里的 cn.axi.moonlight.ap1）'
        required: false
        default: ''
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: build-ipa-upstream
  cancel-in-progress: true

jobs:
建立:
    #macos-14已于2026-11-02退役，会报"configuration is not supported"
    #macos-15=Xcode16.x，当前免费可用的标准macOS标签
run-on: macos-15
timeout-minutes: 60
默认值:
跑:
工作目录: src

步骤:
      - 姓名: 拉取上游仓库（含子模块）
uses: 操作/结帐@v4
和……一起:
存储库: Axixi2233/moonlight-ios
裁判: ${{inputs.upstream_ref}}
子模块: 递归的
提取深度: 1
路径: src

      - 姓名: 确认代码完整
跑: |
set-e
echo"HEAD：$(git rev-parse--short HEAD)$(git log-1--format=%s)"
test-f Moonlight.xcodeproj/project.pbxproj||{echo"工程文件缺失"；出口1；}
试验-f moonlight-common/moonlight-common-c/src/stream.CPP||{echo"moonlight-common-c子模块缺失"；出口1；}
test-f X1Kit/Sources/X1Kit/X1Kit.swift||{echo"X1Kit子模块缺失"；exit 1；}
LS libs/FFmpeg/lib/iOS libs/opus/lib/iOS libs/SDL2/lib/iOS
回显"代码完整"

      - 姓名: 工具链 / 工程结构
跑: |
          xcodebuild -version
          sw_vers
          xcodebuild -list -project Moonlight.xcodeproj -json | tee project-list.json

      - name: 构建（禁用代码签名）
        env:
          CONFIG: ${{ inputs.configuration }}
          NEW_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -o pipefail
          ARGS=(-project Moonlight.xcodeproj -configuration "$CONFIG" -sdk iphoneos -derivedDataPath build)
          if python3 -c 'import json,sys; d=json.load(open("project-list.json"))["project"]; sys.exit(0 if "Moonlight" in d.get("schemes", []) else 1)'
          then
            echo "使用 -scheme Moonlight"
            ARGS+=(-scheme Moonlight -destination 'generic/platform=iOS')
          else
            echo "无 shared scheme，使用 -target Moonlight"
            ARGS+=(-target Moonlight)
          fi

          EXTRA=()
          if [ -n "$NEW_BUNDLE_ID" ]; then
            EXTRA+=("PRODUCT_BUNDLE_IDENTIFIER=$NEW_BUNDLE_ID")
          fi

          set +e
          xcodebuild "${ARGS[@]}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            "${EXTRA[@]}" \
            clean build 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          set -e

          grep -E "error:|\*\* BUILD (SUCCEEDED|FAILED) \*\*" xcodebuild.log | tail -30 || true
          exit $STATUS

      - name: 打包 ipa + 自检
        env:
          CONFIG: ${{ inputs.configuration }}
        run: |
          set -e
          APP_DIR="build/Build/Products/${CONFIG}-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          echo "APP = $APP"
          test -d "$APP" || { echo "找不到 .app"; exit 1; }

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/

姓名
查找/有效负载-名称"embedded.mobileprovision"-delete2>/dev/null||true

AppName=$(基本名称"$APP".app)
IPA_NAME="${APPNAME}-无符号-${CONFIG}.ipa"
IPA="out/${IPA_NAME}"
(cd输出&&zip-qry"$IPA_NAME"有效载荷)

LS-lh"$IPA"
回声"--- 架构 ---"
文件"$APP/$APPNAME"
回声"--- 签名状态 ---"
代码签名-DV"$APP/$APPNAME"2>&1|head-5||true
回声"--- 包信息 ---"
/usr/libexec/PlistBuddy-c"打印：CFBundleIdentifier" "$APP/Info.plist"||true
/usr/libexec/PlistBuddy-c"打印：MinimumOSVersion" "$APP/Info.plist"2>/dev/null||true
/usr/libexec/PlistBuddy-c"打印：CFBundleDisplayName" "$APP/Info.plist"2>/dev/null||true

      - 姓名: 上传ipa
uses: 操作/上载工件@v4
和……一起:
姓名: 月光-ipa-${{输入.配置}}
路径: |
src/out/*.ipa
src/xcodebuild.log
if-no-file-found: 错误
保留天数: 14

      - 姓名: 失败时保留日志
如果: 失败()
uses: 操作/上载工件@v4
和……一起:
姓名: 构建日志
路径: |
src/xcodebuild.log
src/project-list.json
if-no-file-found: 忽略
保留天数: 7
